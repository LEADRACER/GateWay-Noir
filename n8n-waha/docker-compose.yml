services:
  waha:
    image: devlikeapro/waha:latest
    container_name: noir-gateway-waha
    ports:
      - "3002:3000"
    volumes:
      - /root/noir-waha-data/sessions:/app/sessions
      - /root/noir-waha-data/config:/app/config
    environment:
      - WAHA_API_KEY=${WAHA_API_KEY}
      - WAHA_DEFAULT_ENGINE=NOWEB
      - WAHA_WEBHOOK_URL=http://n8n:5678/webhook/whatsapp
      - WAHA_AUTO_START=true
      - WAHA_DEFAULT_SESSION=noir-gateway
      - WAHA_PRINT_QR=true
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/sessions -H \"X-Api-Key: *** > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - N8N_API_KEY=${N8N_API_KEY}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL}
      - DB_TYPE=sqlite
      - DB_SQLITE_DATABASE=/home/node/.n8n/database.sqlite
      - GENERIC_TIMEZONE=UTC
    volumes:
      - /root/n8n_data:/home/node/.n8n
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      - waha

networks:
  default:
    external: true
    name: n8n_n8n_network